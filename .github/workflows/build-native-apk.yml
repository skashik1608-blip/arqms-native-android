name: Build ARQMS Pure Native Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-native-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - run: |
          mkdir -p release_apk
          cp app/build/outputs/apk/debug/app-debug.apk release_apk/ARQMS-Native-Android-v1.0.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ARQMS-Native-Android-APK
          path: release_apk/ARQMS-Native-Android-v1.0.0.apk
